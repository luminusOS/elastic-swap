# Kernel memory tuning for zram swap.
# Installed to /usr/lib/sysctl.d/60-elastic-swap.conf (vendor dir; shadow it from
# /etc/sysctl.d/ to override).
# SPDX-License-Identifier: GPL-3.0-or-later
#
# Only page-cluster is overridden — everything else uses the kernel defaults.
# The previous broader tuning was dropped after measuring it: most values were
# either equal to the kernel default (redundant) or behavioural-only, and
# vm.swappiness=30 was actually COUNTERPRODUCTIVE for memory — under pressure
# the kernel default (60) swaps more inactive pages into compressed zram,
# freeing more real RAM (measured: 30 -> 495MB to zram, 60 -> 578MB).
# vm.min_free_kbytes is set dynamically by the daemon at start, and so are
# transparent huge pages ('madvise'); see `kernel_tuning` in elastic-swap.conf(5).

# ── Swap readahead ──
# Pages read per swap-in operation (2^N pages). 0 = page-at-a-time, optimal for
# zram where each page is compressed individually — the kernel default 3
# (8 pages) causes read amplification on compressed swap.
vm.page-cluster = 0
